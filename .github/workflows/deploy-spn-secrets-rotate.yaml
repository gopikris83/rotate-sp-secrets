name: CDX SPN Secrets Rotation

on:
  workflow_dispatch:
  schedule:
     - cron: '0 6 5 * *'
  push:
    paths:
      - 'rotate-spn-secrets/**'

permissions:
    id-token: write
    contents: read
    actions: read

jobs:
  terraform-deploy:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: <Service principal client id>
      ARM_TENANT_ID: <Tenant id>
      ARM_SUBSCRIPTION_ID: <Subscription id>
      ARM_USE_OIDC: true

    defaults:
      run:
        shell: bash
        working-directory: rotate-spn-secrets/
    steps:
    - name: 'Az CLI login'
      uses: azure/login@v2
      with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan

    - name: Terraform Apply
      if: ${{ (github.ref == 'refs/heads/main') }}
      run: terraform apply -auto-approve

  notify:
    needs: terraform-deploy
    if: ${{ (github.ref == 'refs/heads/main') }}
    secrets: inherit
    uses: flysas-tech/cdx-reusable-workflows/.github/workflows/notify.yml@main
    with:
      message: Workflow to rotate service principals secrets completed
